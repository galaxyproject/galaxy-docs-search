[pytest]
# Pytest configuration for Galaxy documentation search tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    search: marks tests related to search functionality
    metadata: marks tests related to metadata validation
    iwc: marks tests specific to IWC workflows
    gtn: marks tests specific to GTN tutorials
    faq: marks tests specific to FAQs
    discourse: marks tests specific to Discourse posts
    integration: marks tests that use multiple collections

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8
