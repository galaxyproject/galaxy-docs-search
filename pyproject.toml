[project]
name = "chatgxy-materials"
version = "0.1.0"
description = "RAG-ready embedding pipelines for Galaxy project documentation"
authors = [
    {name = "Dannon Baker", email = "dannon.baker@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # OpenAI SDK (for SambaNova API-compatible endpoint)
    "openai>=1.0",
    # LangChain ecosystem
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    # Vector database
    "chromadb>=0.5",
    # Document processing
    "unstructured>=0.15",
    # HTTP client for async support
    "httpx>=0.27",
    "requests>=2.32",
    # Utilities
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
