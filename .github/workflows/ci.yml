name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight CI for the same branch when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (with [mcp] + [dev] extras)
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Tests that hit TACC or need data/embeddings auto-skip when those
        # aren't available; only the unit suite runs in CI today.
        run: uv run pytest tests/ -q
